[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocudrug-graphrag"
version = "1.0.0"
description = "Knowledge-graph-augmented retrieval and reasoning for trustworthy drug repurposing in ocular tumours"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["drug-repurposing", "knowledge-graph", "retrieval-augmented-generation", "ocular-oncology", "provenance"]
dependencies = [
    "numpy>=2.1",
    "networkx>=3.4",
    "pydantic>=2.9",
    "clize>=5.0",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "black>=24.0", "isort>=5.13", "mypy>=1.11", "hypothesis>=6.100"]

[project.scripts]
ocudrug = "ocudrug_graphrag.console.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ocudrug_graphrag = ["custody/schema_v1.0.json"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_any_generics = true
files = ["src/ocudrug_graphrag"]

[[tool.mypy.overrides]]
module = ["clize.*", "sigtools.*", "networkx.*", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
